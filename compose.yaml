version: '3.8'
services:
  webapi:
    image: daf.manga.api
    build:
      context: .
      dockerfile: src/Daf.Manga.Api/Dockerfile
    container_name: webapi
    networks:
      - daf_manga
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__dockerEssentials=Server=postgres;Port=5433;Database=dockerEssentials;User Id=pgadmin;Password=pgadmin
    ports:
      - 5080:8080
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
  mongodb:
    image: mongo:7.0
    container_name: mongo_dev
    networks:
      - daf_manga
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret
      MONGO_INITDB_DATABASE: MangaTracker
    volumes:
      - mongo_data:/data/db

  mongo-express:          # UI web optionnelle mais pratique
    image: mongo-express
    container_name: mongo_express
    networks:
      - daf_manga
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: secret
      ME_CONFIG_MONGODB_URL: mongodb://admin:secret@mongodb:27017/

volumes:
  mongo_data: